<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Peças de Reposição — SGM Caloi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root{--red:#d4232a;--red-d:#a01218;--blue:#1f3a8f;--ink:#1d2430;--muted:#6b7686;
    --line:#e6e9ef;--bg:#f3f5f9;--card:#fff;--green:#15924c;--amber:#d68a12;--purple:#7a5cc8;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
  a{text-decoration:none;color:inherit;}
  .topbar{background:#fff;border-bottom:3px solid var(--purple);padding:14px 28px;display:flex;
    align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.05);}
  .topbar h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;letter-spacing:1px;
    text-transform:uppercase;display:flex;align-items:center;gap:10px;}
  .topbar h1 .ico{color:var(--purple);font-size:22px;}
  .top-actions{display:flex;gap:10px;align-items:center;}
  .btn{border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:.2s;}
  .btn-tpm{background:var(--purple);color:#fff;} .btn-tpm:hover{filter:brightness(.92);}
  .btn-ghost{background:#eef1f6;color:var(--ink);} .btn-ghost:hover{background:#e2e7f0;}
  .wrap{max-width:1280px;margin:0 auto;padding:22px 28px 50px;}
  .filters{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:20px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:600;}
  .field select,.field input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;
    font-family:inherit;color:var(--ink);background:#fff;min-width:150px;}
  .field select:focus,.field input:focus{outline:none;border-color:var(--blue);}
  .filters .spacer{flex:1;}
  .updated{font-size:11px;color:var(--muted);text-align:right;} .updated b{color:var(--green);}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden;}
  .kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--purple));}
  .kpi .v{font-family:'Oswald',sans-serif;font-size:30px;font-weight:700;line-height:1;}
  .kpi .u{font-size:13px;color:var(--muted);font-weight:600;}
  .kpi .k{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-top:6px;font-weight:600;}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .panel h3{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700;
    margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .panel h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--purple);}
  .c-8{grid-column:span 8;} .c-6{grid-column:span 6;} .c-4{grid-column:span 4;} .c-12{grid-column:span 12;}
  .chart-box{position:relative;height:280px;} .chart-box.sm{height:250px;}
  @media(max-width:920px){.c-8,.c-6,.c-4{grid-column:span 12;}}
  .table-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 10px;flex-wrap:wrap;}
  .table-tools h2{font-family:'Oswald',sans-serif;font-size:18px;letter-spacing:.5px;text-transform:uppercase;}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px;}
  thead th{background:#f7f9fc;text-align:left;padding:10px 12px;font-size:11px;letter-spacing:.5px;
    text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;}
  tbody td{padding:9px 12px;border-bottom:1px solid #f1f3f7;vertical-align:top;}
  tbody tr:hover{background:#fafbfe;}
  .tag-pill{font-family:'Oswald',sans-serif;font-weight:600;color:var(--blue);}
  .peca{font-weight:600;}
  .badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.5px;}
  .b-ok{background:#e8f4ec;color:var(--green);} .b-open{background:#fdf3e3;color:var(--amber);}
  .b-def{background:#ecebf7;color:var(--purple);} .b-nd{background:#f1f3f7;color:var(--muted);}
  .empty{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:50px;text-align:center;color:var(--muted);}
  .muted{color:var(--muted);font-size:12px;}
</style>
</head>
<body>
<div class="topbar">
  <h1><span class="ico">🔩</span> Dashboard · Peças de Reposição</h1>
  <div class="top-actions">
    <a class="btn btn-tpm" href="{{ tpm_url or '#' }}" target="_blank" rel="noopener">➕ Abrir TPM</a>
    <a class="btn btn-ghost" href="/portal">← Voltar à Capa</a>
  </div>
</div>

<div class="wrap">
  <div class="filters">
    <div class="field"><label>Ano</label><select id="fAno"><option value="">Todos</option></select></div>
    <div class="field"><label>Mês</label><select id="fMes"><option value="">Todos</option></select></div>
    <div class="field"><label>Setor</label><select id="fSetor"><option value="">Todos</option></select></div>
    <div class="field"><label>Situação da peça</label>
      <select id="fSit"><option value="">Todas</option><option value="def">Definida</option><option value="nd">A definir</option></select></div>
    <div class="field"><label>Equipamento / Código</label><input id="fTag" type="text" placeholder="Buscar..."></div>
    <div class="spacer"></div>
    <div class="updated">Fonte: Plano de Ação (TPM) · <b>online</b><br><span class="muted" id="totalInfo"></span></div>
  </div>

  <div id="content">
    <div class="kpis" id="kpis"></div>
    <div class="grid">
      <div class="panel c-8"><h3><span class="dot"></span>Peças mais demandadas</h3><div class="chart-box"><canvas id="chTop"></canvas></div></div>
      <div class="panel c-4"><h3><span class="dot"></span>Situação</h3><div class="chart-box sm"><canvas id="chSit"></canvas></div></div>
      <div class="panel c-6"><h3><span class="dot"></span>Demanda por equipamento</h3><div class="chart-box"><canvas id="chEquip"></canvas></div></div>
      <div class="panel c-6"><h3><span class="dot"></span>Demanda por setor</h3><div class="chart-box"><canvas id="chSetor"></canvas></div></div>
    </div>

    <div class="table-tools"><h2>Peças necessárias</h2>
      <input id="fBusca" type="text" placeholder="🔎 Buscar peça / equipamento..."
        style="border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13px;min-width:260px;"></div>
    <div style="overflow-x:auto;"><table id="tbl"><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
    <p class="muted" id="tblInfo" style="margin-top:8px;"></p>
  </div>

  <div class="empty" id="empty" style="display:none;">
    <div style="font-size:40px;margin-bottom:10px;">🔩</div>
    <strong>Sem peças registradas ainda.</strong><br>
    As peças vêm do <code>Plano_de_Acao.xlsx</code> do TPM (campo <code>Peças Necessárias</code>).
  </div>
</div>

<script>
const RECORDS = {{ records_json | tojson }};
const KEYS = RECORDS.length ? Object.keys(RECORDS[0]) : [];
function findKey(...c){for(const x of c){const k=KEYS.find(k=>k.toLowerCase().includes(x));if(k)return k;}return null;}
const F={
  data:findKey('data/hora','data'),
  tag:findKey('código','codigo','cód'),
  equip:findKey('equipamento','máquina','maquina'),
  setor:findKey('setor','área','area'),
  pecas:findKey('peça','peca'),
  prob:findKey('problema','outros'),
  status:findKey('status','situa'),
};
function parseData(v){if(!v)return null;const s=String(v);
  let m=s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);
  const d=new Date(s);return isNaN(d)?null:d;}
function val(r,k){return k&&r[k]!=null?r[k]:'';}
function lower(x){return String(x||'').toLowerCase();}
function temPeca(r){const p=lower(val(r,F.pecas)).trim();return p&&p!=='-';}
function definida(r){const p=lower(val(r,F.pecas)).trim();return temPeca(r)&&!p.includes('a definir')&&!p.includes('a definr');}
RECORDS.forEach(r=>r._d=parseData(val(r,F.data)));

const anos=[...new Set(RECORDS.map(r=>r._d?r._d.getFullYear():null).filter(Boolean))].sort((a,b)=>b-a);
const setores=[...new Set(RECORDS.map(r=>String(val(r,F.setor)).trim()).filter(Boolean))].sort();
const MES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
anos.forEach(a=>fAno.add(new Option(a,a)));
MES.forEach((m,i)=>fMes.add(new Option(m,i+1)));
setores.forEach(s=>fSetor.add(new Option(s,s)));

function filtrar(){const a=fAno.value,mes=fMes.value,se=lower(fSetor.value),sit=fSit.value,tag=lower(fTag.value);
  return RECORDS.filter(r=>{
    if(!temPeca(r))return false;                       // só linhas com peça
    if(a&&(!r._d||r._d.getFullYear()!=a))return false;
    if(mes&&(!r._d||(r._d.getMonth()+1)!=mes))return false;
    if(se&&lower(val(r,F.setor))!==se)return false;
    if(sit==='def'&&!definida(r))return false;
    if(sit==='nd'&&definida(r))return false;
    if(tag&&!(lower(val(r,F.tag)).includes(tag)||lower(val(r,F.equip)).includes(tag)||lower(val(r,F.pecas)).includes(tag)))return false;
    return true;});}

function calcKpis(rows){
  const total=rows.length;
  const def=rows.filter(definida).length;
  const nd=total-def;
  const equip=new Set(rows.map(r=>String(val(r,F.equip)).trim()).filter(Boolean)).size;
  const pend=rows.filter(r=>lower(val(r,F.status)).includes('pend')).length;
  return {total,def,nd,equip,pend};
}
function renderKpis(k){
  const cards=[
    {v:k.total,k:'Itens de peça',c:'var(--purple)'},
    {v:k.def,k:'Peças definidas',c:'var(--green)'},
    {v:k.nd,k:'A definir',c:'var(--amber)'},
    {v:k.pend,k:'Em ação pendente',c:'var(--red)'},
    {v:k.equip,k:'Equipamentos',c:'var(--blue)'},
  ];
  kpis.innerHTML=cards.map(c=>`<div class="kpi" style="--c:${c.c}"><div class="v">${c.v}</div><div class="k">${c.k}</div></div>`).join('');
}
let charts={};
const C={red:'#d4232a',blue:'#1f3a8f',green:'#15924c',amber:'#d68a12',gray:'#9aa4b2',purple:'#7a5cc8'};
function mk(id,cfg){if(charts[id])charts[id].destroy();charts[id]=new Chart(document.getElementById(id),cfg);}
function baseOpt(axis){return{responsive:true,maintainAspectRatio:false,indexAxis:axis||'x',
  plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,grid:{color:'#eef1f6'}}}};}
function topN(rows,fn,n){const m={};rows.forEach(r=>{const v=fn(r);if(v)m[v]=(m[v]||0)+1;});
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n);}
function renderCharts(rows){
  const top=topN(rows.filter(definida),r=>String(val(r,F.pecas)).trim(),10);
  mk('chTop',{type:'bar',data:{labels:top.map(e=>e[0]),datasets:[{data:top.map(e=>e[1]),backgroundColor:C.purple,borderRadius:5}]},options:baseOpt('y')});
  const def=rows.filter(definida).length, nd=rows.length-def;
  mk('chSit',{type:'doughnut',data:{labels:['Definida','A definir'],datasets:[{data:[def,nd],backgroundColor:[C.green,C.amber]}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}}}});
  const eq=topN(rows,r=>String(val(r,F.equip)).trim(),10);
  mk('chEquip',{type:'bar',data:{labels:eq.map(e=>e[0]),datasets:[{data:eq.map(e=>e[1]),backgroundColor:C.blue,borderRadius:5}]},options:baseOpt('y')});
  const se=topN(rows,r=>String(val(r,F.setor)).trim(),8);
  mk('chSetor',{type:'bar',data:{labels:se.map(e=>e[0]),datasets:[{data:se.map(e=>e[1]),backgroundColor:C.amber,borderRadius:5}]},options:baseOpt('y')});
}
const COLS=[{k:F.data,t:'Data'},{k:F.tag,t:'Código'},{k:F.equip,t:'Equipamento'},{k:F.setor,t:'Setor'},
  {k:F.pecas,t:'Peça Necessária'},{k:F.prob,t:'Problema'},{k:F.status,t:'Status'}].filter(c=>c.k);
let sortCol=null,sortAsc=true;
function renderTable(rows){
  thead.innerHTML=COLS.map((c,i)=>`<th data-i="${i}">${c.t}</th>`).join('');
  const busca=lower(fBusca.value);
  let data=rows.filter(r=>!busca||COLS.some(c=>lower(val(r,c.k)).includes(busca)));
  if(sortCol!=null){const k=COLS[sortCol].k;data=[...data].sort((a,b)=>{let x=lower(val(a,k)),y=lower(val(b,k));return(x>y?1:x<y?-1:0)*(sortAsc?1:-1);});}
  const show=data.slice(0,300);
  tbody.innerHTML=show.map(r=>`<tr>${COLS.map(c=>{
    let v=val(r,c.k),cell=v;
    if(c.k===F.data&&r._d)cell=r._d.toLocaleDateString('pt-BR');
    else if(c.k===F.status){const s=lower(v);cell=`<span class="badge ${s.includes('conclu')?'b-ok':'b-open'}">${v||'—'}</span>`;}
    else if(c.k===F.tag)cell=`<span class="tag-pill">${v||'—'}</span>`;
    else if(c.k===F.pecas){const d=definida(r);cell=`<span class="peca">${v||'—'}</span> <span class="badge ${d?'b-def':'b-nd'}">${d?'definida':'a definir'}</span>`;}
    else cell=v===''?'—':v;
    return `<td>${cell}</td>`;}).join('')}</tr>`).join('');
  tblInfo.textContent=`Mostrando ${show.length} de ${data.length} itens.`+(data.length>300?' (limite 300)':'');
}
function update(){const rows=filtrar();totalInfo.textContent=`${rows.length} itens de peça no filtro`;
  renderKpis(calcKpis(rows));renderCharts(rows);renderTable(rows);}
[fAno,fMes,fSetor,fSit].forEach(e=>e.addEventListener('change',update));
fTag.addEventListener('input',update);
fBusca.addEventListener('input',()=>renderTable(filtrar()));
thead.addEventListener('click',e=>{const th=e.target.closest('th');if(!th)return;const i=+th.dataset.i;
  if(sortCol===i)sortAsc=!sortAsc;else{sortCol=i;sortAsc=true;}renderTable(filtrar());});
if(!RECORDS.length){content.style.display='none';empty.style.display='block';}else{update();}
</script>
</body>
</html>
